[package]
name = "kaku"
version = "0.2.0"
description = "AI writing actions (rewrite, correct, translate) for any desktop app"
authors = ["Kaku contributors"]
license = "MIT"
repository = "https://github.com/klysman08/Kaku"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kaku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
arboard = "3.7.0"
enigo = "0.6.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["time", "macros", "rt"] }
thiserror = "2.0.21"
log = "0.4.35"
chrono = { version = "0.4.45", features = ["serde"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls", "system-proxy", "http2", "charset", "multipart"] }
sys-locale = "0.3.2"
cpal = "0.18.2"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Threading", "Media_SpeechRecognition", "Globalization", "Foundation", "Foundation_Collections"] }

[dev-dependencies]
tempfile = "3.27.0"
